[project]
name = "floor"
version = "0.1.0"
description = "Seller inbox agent with Tinker fine-tuning"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tinker==0.32.0",
  "tinker-cookbook==0.5.7",
  "torch==2.10.0",
  "transformers==4.57.6",
  "huggingface-hub>=0.34,<1",
  "python-dotenv>=1,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
